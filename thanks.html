<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote Request Sent | The Dustbusters</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-page{min-height:100vh;background:#050505;color:#fff;display:grid;place-items:center;padding:32px}
    .thanks-card{width:min(100%,720px);text-align:center;background:#111;border:1px solid rgba(255,216,22,.35);border-radius:30px;padding:48px 32px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .thanks-card img{width:min(280px,70%);margin:0 auto 24px;border-radius:20px}
    .thanks-card h1{font-size:clamp(2.4rem,7vw,4.5rem);line-height:1;margin:0 0 18px;color:#ffd816}
    .thanks-card p{color:#d7d7d1;font-size:1.06rem}
    .thanks-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    .thanks-actions a{min-width:190px}
  </style>
</head>
<body>
  <main class="thanks-page">
    <section class="thanks-card">
      <img src="795704731_1526595265891498_8297181487978766166_n%20(1).jpg" alt="The Dustbusters logo">
      <h1>Quote request sent!</h1>
      <p>Thanks for reaching out to The Dustbusters. We received your cleaning request and will follow up using the contact method you selected.</p>
      <p><strong>We bust the dust so you don’t have to!</strong></p>
      <div class="thanks-actions">
        <a class="button button-primary" href="tel:+18634442040">Call 863-444-2040</a>
        <a class="button button-outline" href="/">Back to Website</a>
      </div>
    </section>
  </main>
</body>
</html>
